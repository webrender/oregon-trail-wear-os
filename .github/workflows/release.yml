##
# Build a signed APK and publish it to GitHub Releases, so that installing the game does
# not require a checkout, an Android SDK and a working Gradle toolchain.
#
# Triggered by pushing a tag:
#
#     git tag v0.2 && git push origin v0.2
#
# The tag is the version. `v0.2` becomes versionName `0.2` and a release titled `v0.2`;
# a tag with a hyphen in it (`v0.3-beta1`) is published as a pre-release, which keeps it
# out of the repository's "latest release" link and off the README download badge.
#
# versionCode comes from the workflow run number rather than the tag, because Android
# refuses to install an APK whose code is not greater than the installed one and the run
# number is the only thing here that is guaranteed to keep increasing. It has no meaning
# beyond that ordering — the version anyone reads is the name.
#
# The APK is signed with the project's own release key, held in four repository secrets
# (KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD). Every release must be
# signed with that same key or it cannot be installed as an upgrade over the previous
# one — so if the key is ever lost, the readable copy is beside the keystore itself on
# the owner's machine, not here.
name: Release

on:
  push:
    tags: ['v*']

# `gh release create` writes to the repository. Nothing else here needs a token.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # `$RUNNER_TEMP`, not the workspace: a keystore inside the checkout could be picked
      # up by a later step that archives or publishes the working tree.
      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 is not set. See the signing notes in the README."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Read the version out of the tag
        id: version
        run: |
          name="${GITHUB_REF_NAME#v}"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # A hyphen marks a pre-release: v0.3-beta1, v1.0-rc2.
          case "$GITHUB_REF_NAME" in
            *-*) echo "prerelease=true"  >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      # The engine tests are pure JVM and take seconds. A tag that fails them should not
      # become a download.
      - name: Test the engine
        run: ./gradlew :shared:testDebugUnitTest --no-daemon

      - name: Build the signed APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -Pkeystore="$RUNNER_TEMP/release.jks" \
            -PkeystorePassword="$KEYSTORE_PASSWORD" \
            -PkeyAlias="$KEY_ALIAS" \
            -PkeyPassword="$KEY_PASSWORD" \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${{ github.run_number }}"

      # Proves the APK is signed at all and reports which certificate signed it, so a
      # mismatch shows up in the log of the release that introduced it rather than on
      # someone's watch months later. The build-tools directory is versioned, and which
      # version the runner image ships changes; take whichever is newest.
      - name: Verify the signature
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner 2>/dev/null | sort -V | tail -1)
          if [ -z "$apksigner" ]; then
            echo "::error::No apksigner under $ANDROID_HOME/build-tools."
            exit 1
          fi
          "$apksigner" verify --print-certs --verbose app/build/outputs/apk/release/app-release.apk

      # `app-release.apk` says nothing about what it is or which version it is once it has
      # been downloaded into someone's Downloads folder next to five other app-release.apks.
      - name: Name the APK for a human
        id: apk
        run: |
          path="oregon-trail-wear-${{ steps.version.outputs.name }}.apk"
          mv app/build/outputs/apk/release/app-release.apk "$path"
          echo "path=$path" >> "$GITHUB_OUTPUT"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --notes-file - \
            ${{ steps.version.outputs.prerelease == 'true' && '--prerelease' || '' }} <<'NOTES'
          Sideload onto a Wear OS 4 (API 33) or newer watch:

          ```
          adb install -r oregon-trail-wear-${{ steps.version.outputs.name }}.apk
          ```

          Or [play it in a browser](https://webrender.net/oregon-trail-wear-os/) — same game,
          no install.
          NOTES
