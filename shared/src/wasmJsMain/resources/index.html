<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>The Oregon Trail</title>
    <style>
        /*
         * The page is the bezel's surround and nothing else. Everything visible is drawn
         * by Compose into the canvas below — see Main.kt, which puts a 192dp round screen
         * in the middle of it, magnified to fill whichever way round the window is.
         */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            /* `dvh` and not `%`, on the phones this port exists for. A percentage height
               resolves against the *large* viewport — the one a mobile browser has with its
               address bar rolled away — so with the bar on screen the page, and therefore
               Compose's container and its canvas, is a bar's height taller than anything you
               can see. The watch is centred in that taller box and so sits low, with its
               bottom edge behind the toolbar. `dvh` follows the viewport that is actually
               visible. Nothing here scrolls, so the bar never hides and this never animates:
               the dynamic unit is simply the correct one to measure against. `%` stays above
               it for browsers that have no `dvh`. */
            height: 100dvh;
            overflow: hidden;
            background: #000;
            /* Compose's canvas is an inline element, so it sits on a text baseline and the
               line box reserves room for descenders under it — five pixels of page taller
               than the window, hidden here only by `overflow: hidden`. The canvas lives in a
               shadow root that this stylesheet cannot select into, but `line-height` is
               inherited and crosses the boundary, so setting it here is what reaches it. */
            line-height: 0;
            /* The game reads every arrow key. Letting the page scroll on them too would
               shift the canvas out from under the pointer while the map is being scrubbed. */
            overscroll-behavior: none;
            /* The browser gets no touch gestures at all — not a pan, not a pinch, not a
               swipe-to-navigate. The raft is steered by dragging across this page (see
               `Modifier.horizontalDragInput`), and every one of those gestures is something
               a browser would rather do with that drag than give it to the game. This is
               also what turns off pinch-zoom, which is fine and deliberate: there is one
               canvas here and it already sizes itself to the window, so there is nothing
               a zoom could reveal. */
            touch-action: none;
        }

        /* No text selection anywhere: a drag across a menu is a scroll, not a selection,
           and the I-beam cursor over a watch face is a giveaway that it is a web page. */
        body {
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            /* Mobile Safari and Chrome paint a grey flash over whatever was tapped. On a
               canvas that is the whole game, so the flash is the whole screen. */
            -webkit-tap-highlight-color: transparent;
        }

        #loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #1E6B00;
            font: 16px ui-monospace, SFMono-Regular, Menlo, monospace;
            letter-spacing: 0.15em;
        }
    </style>
</head>
<body>
<!--
  Shown until the wasm module has fetched the font and is ready to draw, at which point
  `main()` removes it — Compose appends its canvas rather than replacing the body, so this
  would otherwise sit above the watch and push it off centre. It is worth having: the
  runtime is about 10MB before compression, and a blank black page for several seconds
  reads as a site that failed to load.
-->
<div id="loading">OUTFITTING THE WAGON&hellip;</div>
<script src="oregontrail.js"></script>
</body>
</html>
